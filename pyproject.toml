[project]
name = "prism-hormonal-health"
version = "0.1.0"
description = "PRISM: Personalized Reproductive and Integrated Systemic Model — a modular, condition-agnostic hormonal-health modeling pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "PRISM contributors" }]
keywords = ["hormonal-health", "pcos", "multimodal", "provenance", "research"]

dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.12",
]

[project.optional-dependencies]
tabular = ["xgboost>=2.0"]
torch = ["torch>=2.2"]
speech = ["jiwer>=3.0"]
documents = ["pdfplumber>=0.11"]
imaging = ["pydicom>=2.4", "scikit-image>=0.22"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "schemas",
    "ingestion",
    "event_store",
    "features",
    "models",
    "training",
    "evaluation",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["N803", "N806", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "smoke: tiny synthetic end-to-end checks, never scientific results",
    "integration: multi-module checks on synthetic fixtures",
    "contract: schema and registry contract checks",
]
